name: Build Firmware

# When this workflow runs:
#  - every push to jz-dev or a scott/* development branch
#  - every pull request targeting any branch
on:
  push:
    branches: [jz-dev, 'scott/**']
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upstream control, trajectory, CRC and SVPWM tests
        run: sh test/run_tests.sh
      - name: Current tuning, Recorder and board profile tests
        run: bash tools/tuning/test-current-tuning.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.2.Rel1'          # matches the version used for local dev
          path-env-var: ARM_TOOLCHAIN_BIN_DIR

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Report firmware size
        run: arm-none-eabi-size build/fw.elf
